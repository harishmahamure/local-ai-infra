# GPU mutex notes (not a systemd drop-in).
#
# Only one of llama-fast or gemma may occupy the 5090.
# Enforcement:
#   - Conflicts= on each unit
#   - ExecStartPre=ensure-exclusive.sh (stops other units + stray processes)
#   - `ai start` / `ai switch` stop everything first
#   - units are not enabled — do not `systemctl --user enable` them
