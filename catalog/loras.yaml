# LoRA registry. Exclusive groups prevent incompatible simultaneous adapters.
# LTX-2 / LTX-2.3 weights require a compatibility test before /v1 auto-use.

groups:
  qwen_speed:
    max_active: 1

loras:
  - id: qwen-lightning
    family: qwen-image-2512
    role: speed
    file: Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors
    bundle: qwen-image-2512-lightning-lora
    compatible_models: [qwen-image-2512-fp8]
    recommended_strength: 1.0
    allowed_strength_range: [0.0, 1.0]
    exclusive_group: qwen_speed
    license: Apache-2.0
    commercial_use: true
    compatibility_status: validated
    compatibility_test_required: false

