    required_models: [qwen-image-layered]
    optional_models: [qwen-image-2512-fp8]
    required_nodes: [EmptyQwenImageLayeredLatentImage, LatentCut, LatentCutToBatch]
    supported_presets: [draft, balanced, master]
    supports_seed: true
    supports_cancel: true
    supports_batch: false
    resource:
      estimated_vram_gb: 22
      profile: comfy
      timeout_class: image
    bindings:
      prompt: {key: prompt}
      seed: {key: seed}
      image: {key: image_name}

