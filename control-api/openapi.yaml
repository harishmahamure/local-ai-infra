openapi: 3.1.0
info:
  title: llama.cpp Control API
  version: "4.0.0"
  description: |
    Minimal llama.cpp control plane on the GPU box.

    Mac proxy: `http://127.0.0.1:8090` → GPU `http://192.168.50.100:8090`.
servers:
  - url: http://127.0.0.1:8090
    description: Mac proxy (LAN)
  - url: http://192.168.50.100:8090
    description: GPU box (direct)
tags:
  - name: Health
  - name: llama.cpp
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is up
  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: 200 if a llama.cpp profile is LOADED; 503 otherwise.
      responses:
        "200":
          description: A text model is loaded
        "503":
          description: GPU idle or still starting
  /v1/status:
    get:
      tags: [llama.cpp]
      summary: GPU runtime status
      responses:
        "200":
          description: loadState, profile, VRAM, processes
  /v1/models:
    get:
      tags: [llama.cpp]
      summary: Catalog files on disk plus runtime state
      responses:
        "200":
          description: bundles + models
  /v1/models/{model_id}:
    get:
      tags: [llama.cpp]
      summary: One catalog model
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Model record
        "409":
          description: Unknown model
  /v1/models/{model_id}/load:
    post:
      tags: [llama.cpp]
      summary: Load model onto the GPU
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Profile started
  /v1/models/{model_id}/unload:
    post:
      tags: [llama.cpp]
      summary: Unload model from the GPU
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: All profiles stopped
  /v1/text/models:
    get:
      tags: [llama.cpp]
      summary: Chat-capable models
      responses:
        "200":
          description: gemma-4-e4b and qwen36-35b-a3b-rq
  /v1/text/chat:
    post:
      tags: [llama.cpp]
      summary: Text + vision chat
      description: Synchronous JSON or SSE when stream=true. Starts llama-fast or gemma as needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextChatRequest"
      responses:
        "200":
          description: Chat completion (or text/event-stream)
  /v1/downloads:
    get:
      tags: [llama.cpp]
      summary: GGUF download status
      responses:
        "200":
          description: Download state and progress
    post:
      tags: [llama.cpp]
      summary: Queue a GGUF download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequest"
      responses:
        "202":
          description: Download started
components:
  schemas:
    TextChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: gemma-4-e4b or qwen36-35b-a3b-rq
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string}
              content: {}
        temperature: {type: number}
        max_tokens: {type: integer}
        stream: {type: boolean, default: false}
    DownloadRequest:
      type: object
      properties:
        ids:
          type: array
          items: {type: string}
          description: Catalog ids. Empty = all llamacpp bundles.
