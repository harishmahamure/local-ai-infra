      type: object
      title: DownloadRequest
    GenerateRequest:
      properties:
        prompt:
          type: string
          title: Prompt
          description: Natural-language image request (shorthand when prompts is omitted)
          default: ''
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
          description: Optional base64 or data URL reference image
        images:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Images
          description: Extra references for merge (2–3) or extra uploads
        plan:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Plan
          description: Explicit plan; skips the Gemma planner
        flow:
          anyOf:
          - type: string
            pattern: ^(t2i|text_edit|merge|semantic_edit|layered|control|lightning)$
          - type: 'null'
          title: Flow
        controlType:
          anyOf:
          - type: string
            pattern: ^(pose|depth|canny)$
          - type: 'null'
          title: Controltype
        controlStrength:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Controlstrength
        layers:
          anyOf:
          - type: integer
            maximum: 8.0
            minimum: 1.0
          - type: 'null'
          title: Layers
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        width:
          anyOf:
          - type: integer
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
          - type: 'null'
          title: Height
        count:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Count
          description: Same-prompt batch size (shorthand mode)
          default: 1
        prompts:
          anyOf:
          - items:
              $ref: '#/components/schemas/PromptItem'
            type: array
          - type: 'null'
          title: Prompts
          description: Multi-prompt batch (preferred). Takes precedence over prompt.
        fastGenMode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Fastgenmode
          description: Omit or null for auto; true forces Lightning 4-step
        steps:
          anyOf:
          - type: integer
          - type: 'null'
          title: Steps
          description: Omit or null for auto; integer to override
        upscale:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Upscale
          description: Omit or null for auto; true/false to override
      type: object
      title: GenerateRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
