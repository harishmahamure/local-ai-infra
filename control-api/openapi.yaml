openapi: 3.1.0
info:
  title: GPU Control API
  version: "5.0.0"
  description: |
    Exclusive GPU control plane: llama.cpp chat, ComfyUI Qwen image jobs, and LTX live wallpapers.

    Mac proxy: `http://127.0.0.1:8090` → GPU `http://192.168.50.100:8090`.
servers:
  - url: http://127.0.0.1:8090
    description: Mac proxy (LAN)
  - url: http://192.168.50.100:8090
    description: GPU box (direct)
tags:
  - name: Health
  - name: llama.cpp
  - name: image
  - name: video
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is up
  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: 200 if a GPU profile is LOADED; 503 otherwise.
      responses:
        "200":
          description: A profile is loaded
        "503":
          description: GPU idle or still starting
  /v1/status:
    get:
      tags: [llama.cpp]
      summary: GPU runtime status
      responses:
        "200":
          description: loadState, profile, VRAM, processes, image queue
  /v1/models:
    get:
      tags: [llama.cpp]
      summary: Catalog files on disk plus runtime state
      responses:
        "200":
          description: bundles + models
  /v1/models/{model_id}:
    get:
      tags: [llama.cpp]
      summary: One catalog model
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Model record
        "409":
          description: Unknown model
  /v1/models/{model_id}/load:
    post:
      tags: [llama.cpp]
      summary: Load model onto the GPU
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Profile started
        "409":
          description: GPU busy with an image job
  /v1/models/{model_id}/unload:
    post:
      tags: [llama.cpp]
      summary: Unload model from the GPU
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: All profiles stopped
  /v1/text/models:
    get:
      tags: [llama.cpp]
      summary: Chat-capable models
      responses:
        "200":
          description: gemma-4-e4b and qwen36-35b-a3b-rq
  /v1/text/chat:
    post:
      tags: [llama.cpp]
      summary: Text + vision chat
      description: Synchronous JSON or SSE when stream=true. Starts llama-fast or gemma as needed. 409 if an image job holds the GPU.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextChatRequest"
      responses:
        "200":
          description: Chat completion (or text/event-stream)
  /v1/downloads:
    get:
      tags: [llama.cpp]
      summary: Catalog download status
      responses:
        "200":
          description: Download state and progress
    post:
      tags: [llama.cpp]
      summary: Queue a catalog download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequest"
      responses:
        "202":
          description: Download started
  /v1/image/operations:
    get:
      tags: [image]
      summary: List image operations
      responses:
        "200":
          description: Eleven Qwen operations with schemas and availability
  /v1/image/jobs:
    post:
      tags: [image]
      summary: Queue an image job
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageJobRequest"
      responses:
        "202":
          description: Job queued
  /v1/video/operations:
    get:
      tags: [video]
      summary: List video operations
      responses:
        "200":
          description: Live wallpaper operations and LTX capabilities
  /v1/video/jobs:
    post:
      tags: [video]
      summary: Queue a video job
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoJobRequest"
      responses:
        "202":
          description: Job queued
  /v1/shots/flows:
    get:
      tags: [shots]
      summary: List shot generation flows
      responses:
        "200":
          description: Shot flows and camera/control capabilities
  /v1/shots/jobs:
    post:
      tags: [shots]
      summary: Queue a shot job
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotJobRequest"
      responses:
        "202":
          description: Job queued
  /v1/jobs:
    get:
      tags: [image]
      summary: List jobs
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 20}
      responses:
        "200":
          description: Cursor-paginated jobs
    delete:
      tags: [image]
      summary: Delete jobs
      parameters:
        - name: status
          in: query
          schema: {type: string}
          description: If set, only delete jobs in this status. Running jobs are never bulk-deleted.
        - name: delete_assets
          in: query
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Jobs deleted
        "400":
          description: Invalid status, or attempted bulk-delete of running jobs
  /v1/jobs/{job_id}:
    get:
      tags: [image]
      summary: Get job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Status, phase, progress, assets, error
    delete:
      tags: [image]
      summary: Delete a job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
        - name: delete_assets
          in: query
          schema: {type: boolean, default: true}
          description: Also delete generated images from disk
      responses:
        "200":
          description: Job deleted
        "400":
          description: Unknown job, or job is still running
  /v1/jobs/{job_id}/assets:
    delete:
      tags: [image]
      summary: Delete all images for a job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Images deleted
  /v1/jobs/{job_id}/events:
    get:
      tags: [image]
      summary: Job SSE stream
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: text/event-stream
  /v1/jobs/{job_id}/cancel:
    post:
      tags: [image]
      summary: Cancel a job
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Cancelled or cancel requested
  /v1/assets:
    post:
      tags: [image]
      summary: Upload an asset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Asset metadata
    delete:
      tags: [image]
      summary: Delete all assets from disk
      description: Skips images still attached to a running job.
      responses:
        "200":
          description: Assets deleted
  /v1/assets/{asset_id}:
    get:
      tags: [image]
      summary: Asset metadata
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Metadata
        "404":
          description: Not found
    delete:
      tags: [image]
      summary: Delete an asset and its file on disk
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Asset deleted
        "404":
          description: Not found
  /v1/assets/{asset_id}/content:
    get:
      tags: [image]
      summary: Asset bytes
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Image file
components:
  schemas:
    TextChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: gemma-4-e4b or qwen36-35b-a3b-rq
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: {type: string}
              content: {}
        temperature: {type: number}
        max_tokens: {type: integer}
        stream: {type: boolean, default: false}
    DownloadRequest:
      type: object
      properties:
        ids:
          type: array
          items: {type: string}
          description: Catalog ids. Empty = all bundles.
    ImageJobRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum:
            - generate_character
            - generate_character_turnaround
            - generate_attire
            - generate_location
            - generate_prop
            - generate_keyframe
            - generate_shot_reference
            - inpaint_asset
            - outpaint_asset
            - upscale_asset
            - generate_devotion_wallpaper
        prompt: {type: string}
        negative_prompt: {type: string}
        target:
          type: string
          enum: [mobile, desktop]
          description: Wallpaper target for generate_devotion_wallpaper. Default desktop.
        upscale:
          type: boolean
          description: 2x RealESRGAN after devotion wallpaper. Default true.
        style_preset:
          type: string
          enum:
            - cinematic_naturalism
            - painterly_concept
            - graphic_still
            - photoreal_cinematic
            - documentary
            - off
          description: Look lock for character, turnaround, keyframe, and shot. Default cinematic_naturalism. off disables injection.
        width: {type: integer}
        height: {type: integer}
        seed: {type: integer}
        fast: {type: boolean, default: false}
        scale: {type: integer, description: "2 or 4 for upscale_asset"}
        left: {type: integer}
        right: {type: integer}
        top: {type: integer}
        bottom: {type: integer}
        framing: {type: string}
        lens: {type: string}
        camera_height: {type: string}
        image:
          $ref: "#/components/schemas/AssetRef"
        mask:
          $ref: "#/components/schemas/AssetRef"
        character:
          $ref: "#/components/schemas/AssetRef"
        attire:
          $ref: "#/components/schemas/AssetRef"
        location:
          $ref: "#/components/schemas/AssetRef"
    VideoJobRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [generate_live_wallpaper, generate_video]
        prompt: {type: string}
        negative_prompt: {type: string}
        target:
          type: string
          enum: [mobile, video]
          description: mobile portrait or landscape video. Default mobile.
        width: {type: integer}
        height: {type: integer}
        seed: {type: integer}
        steps: {type: integer}
        cfg: {type: number}
        video_cfg: {type: number}
        duration: {type: number}
        fps: {type: integer}
        refine: {type: boolean, default: true}
        sampler_name: {type: string}
        image:
          $ref: "#/components/schemas/AssetRef"
    ShotJobRequest:
      type: object
      required: [operation]
      properties:
        operation: {type: string}
        prompt: {type: string}
        negative_prompt: {type: string}
        target: {type: string, enum: [mobile, video]}
        width: {type: integer}
        height: {type: integer}
        seed: {type: integer}
        steps: {type: integer}
        duration: {type: number}
        fps: {type: integer}
        refine: {type: boolean, default: true}
        camera: {type: string}
        control: {type: string}
        action: {type: string}
        parent_job_id: {type: string}
        image:
          $ref: "#/components/schemas/AssetRef"
        end_image:
          $ref: "#/components/schemas/AssetRef"
        video:
          $ref: "#/components/schemas/AssetRef"
        clips:
          type: array
          items:
            $ref: "#/components/schemas/AssetRef"
        keyframes:
          type: array
          items:
            type: object
            required: [asset_id]
            properties:
              asset_id: {type: string}
              frame_idx: {type: integer}
              strength: {type: number}
    AssetRef:
      type: object
      required: [asset_id]
      properties:
        asset_id: {type: string}
