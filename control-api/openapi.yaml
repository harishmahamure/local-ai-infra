        negativePrompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Negativeprompt
        samplerName:
          anyOf:
          - type: string
          - type: 'null'
          title: Samplername
        maxShift:
          anyOf:
          - type: number
          - type: 'null'
          title: Maxshift
        baseShift:
          anyOf:
          - type: number
          - type: 'null'
          title: Baseshift
        terminal:
          anyOf:
          - type: number
          - type: 'null'
          title: Terminal
        stretch:
