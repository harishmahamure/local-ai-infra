openapi: 3.1.0
info:
  title: AI Media Inference Engine
  description: 'Two surfaces on the same server:


    - **Engine `/v1`** — catalog operations, job queue, assets, text chat.

    - **Control `/api/v1`** — GPU profiles, catalog downloads, generate / upscale / LTX, cleanup.


    Mac proxy: `http://127.0.0.1:8090` → GPU `http://192.168.50.100:8090`.

    Interactive docs: `/docs` (Swagger) and `/redoc`.'
  version: 3.0.0
servers:
- url: http://127.0.0.1:8090
  description: Mac proxy (LAN)
- url: http://192.168.50.100:8090
  description: GPU box (direct)
paths:
  /v1/jobs:
    post:
      tags:
      - Engine (/v1)
      summary: Submit a catalog job
      description: Queue an implemented operation (image.generate, video.generate, text.chat, …). Pass
        Idempotency-Key to replay the same accept response. Inputs use asset_id, not filesystem paths.
      operationId: submit_job_v1_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}:
    get:
      tags:
      - Engine (/v1)
      summary: Get job status
      description: 'Public job record: status, phase, progress, artifacts, error.'
      operationId: get_job_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/events:
    get:
      tags:
      - Engine (/v1)
      summary: Job event stream (SSE)
      description: Server-sent events for job.progress, job.completed, job.failed, job.cancelled. Keepalive
        comments every 15s.
      operationId: job_events_v1_jobs__job_id__events_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/cancel:
    post:
      tags:
      - Engine (/v1)
      summary: Cancel a job
      operationId: cancel_job_v1_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jobs/{job_id}/retry:
    post:
      tags:
      - Engine (/v1)
      summary: Retry a job
      description: 'strategy: same | new_seed | override | rerun_stage. override may send new parameters;
        rerun_stage needs stage.'
      operationId: retry_job_v1_jobs__job_id__retry_post
      parameters:
